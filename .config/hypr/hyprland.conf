# #######################################################################################
# OPTIMIZED HYPRLAND CONFIG (AUDITED, FIXED syntax & UWSM INTEGRATED)
# #######################################################################################

autogenerated = 0

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1, 1920x1080@120, 0x0, 1.0
monitor = HDMI-A-1, 3840x2160@60, auto, 1, mirror, eDP-1

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

# Autostart necessary background utilities as isolated Systemd units via UWSM
exec-once = uwsm app -- dunst
exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- waybar
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = uwsm app -- xwaylandvideobridge
exec-once = xhost +SI:localuser:$USER

# Startup Desktop Login Sound
exec-once = uwsm app -- paplay /usr/share/sounds/ocean/stereo/desktop-login.oga

# Auto-start system health tracking daemons securely inside systemd units
exec-once = uwsm app -- ~/.config/hypr/scripts/battery_monitor.sh
exec-once = uwsm app -- ~/.config/hypr/scripts/sys_monitor.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland;xcb
cursor:no_hardware_cursors = true

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 1

    col.active_border = rgba(33ccffee) rgba(4e0d6dee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 1
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 1
        passes = 1
        special = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = launcherIn, 0.1, 1.1, 0.1, 1.05
    bezier = launcherOut, 0.3, 0.0, 0.8, 0.15

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
    animation = layersIn, 1, 3.5, launcherIn, slidevert
    animation = layersOut, 1, 3, launcherOut, slidevert
}



dwindle {
    preserve_split = true 
    special_scale_factor = 0.90
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 

    touchpad {
        natural_scroll = true
    }
}

#gestures {
#    workspace_swipe = true
#}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

# Applications wrapped safely via UWSM Systemd App Units
bind = $mainMod, Q, exec, uwsm app -- $terminal
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, F, exec, uwsm app -- firefox
bind = $mainMod, B, exec, uwsm app -- blueman-manager
bind = $mainMod, V, exec, uwsm app -- pavucontrol
bind = $mainMod, R, exec, uwsm app -- $menu
bind = $mainMod, Backspace, exec, ~/.config/hypr/scripts/lock_screen.sh

# Session and Window Lifecycles
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, uwsm stop
bind = $mainMod, K, exec, killall waybar && uwsm app -- waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Screenshot Utilities
bind = $mainMod ALT, S, exec, grim -g "$(slurp)" - | swappy -f - 

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Script & Media Triggers
bind = $mainMod, F1, exec, ~/.config/hypr/Scripts/notify-song.sh

# Audio Controls (Routed directly to your custom Dunst OSD Handler)
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume_brightness.sh vol_down
bindel = $mainMod, F2,           exec, ~/.config/hypr/scripts/volume_brightness.sh vol_down
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume_brightness.sh vol_up
bindel = $mainMod, F3,           exec, ~/.config/hypr/scripts/volume_brightness.sh vol_up
bindl  = , XF86AudioMute,        exec, ~/.config/hypr/scripts/volume_brightness.sh vol_mute
bindl  = $mainMod, F4,           exec, ~/.config/hypr/scripts/volume_brightness.sh vol_mute

# Media Controls
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = $mainMod, F5, exec, playerctl previous
bindl = ,XF86AudioNext, exec, playerctl next
bindl = $mainMod, F6, exec, playerctl next
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = $mainMod, F7, exec, playerctl play-pause
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = $mainMod, F8, exec, playerctl play-pause

# Brightness Controls (Routed directly to your custom Dunst OSD Handler)
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/volume_brightness.sh bright_down
bindel = $mainMod, F9,            exec, ~/.config/hypr/scripts/volume_brightness.sh bright_down
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/volume_brightness.sh bright_up
bindel = $mainMod, F10,           exec, ~/.config/hypr/scripts/volume_brightness.sh bright_up

# Notifications Testing
bind = $mainMod, F11, exec, notify-send --expire-time=2000 "F11 PRESSED"
bind = $mainMod, F12, exec, notify-send --expire-time=2000 "F12 PRESSED"

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Fixed deprecated windowrulev2 keyword and updated strict property typing
windowrule = match:class ^(org.gnome.Calculator)$, float 1
windowrule = match:class ^(org.gnome.Calculator)$, size 360 520
windowrule = match:class ^(org.gnome.Calculator)$, center 1

# Bluetooth Docket Popover Rules
windowrule = float, ^(Bluetooth Docket)$
windowrule = pin, ^(Bluetooth Docket)$
windowrule = move 1350 48, ^(Bluetooth Docket)$
windowrule = noborder, ^(Bluetooth Docket)$

