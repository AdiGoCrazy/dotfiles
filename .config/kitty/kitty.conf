# ==============================================================================
# SCALED HIGH-VISIBILITY WORKSPACE (UPGRADED POWERHOUSE EDITION)
# ==============================================================================

# --- Typography & Bigger Layout Metrics ---------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font SemiBold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font SemiBold Italic

# Drastically increased font size for readability on high-res displays
font_size        18.0

disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# --- Proportional Spacing (Prevents Cramping) ---------------------------------
# Increased padding to balance out the larger font scale nicely
window_margin_width     0 0 0 0 
window_padding_width    22
placement_strategy      center
confirm_os_window_close 0

# --- Smooth Next-Gen Cursor Trails (Scaled Thickness) -------------------------
cursor_shape               beam
cursor_beam_thickness      3.0  
cursor_blink_interval      0
cursor_trail               9
cursor_trail_amount        80
cursor_trail_decay         0.08 0.25

# --- High-Refresh Rate Kinetic Fluid Scrolling --------------------------------
# Forcing higher redraw delays syncs flawlessly with 144Hz+ gaming displays
sync_to_monitor            yes
repaint_delay              5
input_delay                1
wheel_scroll_multiplier    4.0
touch_scroll_multiplier    2.0
scrollback_lines           10000

# --- Advanced Layout Management -----------------------------------------------
# Enables power splitting layouts alongside full-window stacking focus
enabled_layouts            splits,stack,fat,tall

# --- The Floating Minimalist Pill Tab Bar -------------------------------------
# Shifts tab blocks into a beautifully styled floating status row at the bottom
tab_bar_edge               bottom
tab_bar_style              fade
tab_fade                   0.3 0.6 0.9 1
tab_bar_align              center
tab_bar_min_tabs           1
tab_activity_symbol        "󱐌 "
active_tab_font_style      bold
inactive_tab_font_style    italic

# --- Opacity & Blur Sync ------------------------------------------------------
# Low opacity gives a beautiful glassy window effect under Hyprland blur
background_opacity         0.8
dynamic_background_opacity yes

# Sets a slight dark tint so text remains super readable even over bright wallpapers
background_tint            0.2
dim_opacity                0.80

# Title bar templates utilizing gorgeous Nerd Font iconography
tab_title_template         " 󰖟 {index} • {title.split('/')[-1]} "
active_tab_title_template  " 󰮯 {title.split('/')[-1]} "

# --- Hyperlinks & Audio Mechanics --------------------------------------------
detect_urls                yes
url_style                  double
url_color                  #F5E0DC
open_url_with              xdg-open
enable_audio_bell          no

# --- Shell Integration & Mechanics --------------------------------------------
shell_integration          enabled
allow_hyperlinks           yes
paste_actions              quote-urls-at-prompt

# --- Seamless Catppuccin Mocha Color Palette ----------------------------------
foreground                 #CDD6F4
background                 #1E1E2E
selection_foreground       #1E1E2E
selection_background       #F5E0DC
cursor                     #F5E0DC
cursor_text_color          #1E1E2E

# Keeps windows borderless so they blend directly into Hyprland's drop shadows
active_border_color        #1E1E2E
inactive_border_color      #1E1E2E
bell_border_color          #F9E2AF

# Tab Bar Elements
active_tab_foreground      #1E1E2E
active_tab_background      #CBA6F7
inactive_tab_foreground    #6C7086
inactive_tab_background    #11111B
tab_bar_background         #1E1E2E

# 16 Base Terminal Colors
color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

# ==============================================================================
# KEYMAPS, REMOTES & ADVANCED CONTROLS 
# ==============================================================================
kitty_mod ctrl+shift

# Scriptable Control Engine (External script/window manager sync)
allow_remote_control       yes
listen_on                  unix:@mykitty

# --- Core Mechanics & Re-loads ------------------------------------------------
map kitty_mod+f5           load_config_file
map kitty_mod+t            kitten themes
map kitty_mod+e            kitten unicode_input

# --- Advanced Layout Splitting & Navigation ----------------------------------
map kitty_mod+enter        launch --location=split --cwd=current
map alt+left               neighboring_window left
map alt+right              neighboring_window right
map alt+up                 neighboring_window up
map alt+down               neighboring_window down

# Zoom/Maximize active pane toggle (Stack layout toggle)
map kitty_mod+z            toggle_layout stack

# Layout Resizing Engine
map kitty_mod+r            start_resizing_window
map kitty_mod+alt+left     resize_window narrower
map kitty_mod+alt+right    resize_window wider
map kitty_mod+alt+up       resize_window taller
map kitty_mod+alt+down     resize_window shorter

# --- High-Performance Interactive Scrollback Search --------------------------
# Uses fzf to interactively crawl terminal history (Requires fzf installed)
scrollback_pager           fzf --ansi --reverse --input-label=" Search History " --preview-window=down:0
map kitty_mod+h            show_scrollback

# --- Keyboard-Driven Hint Actions & Clipboard Grabbing ------------------------
# Instantly highlights/opens hyperlinks without touching the mouse
map kitty_mod+o            kitten hints --type url

# Highlights on-screen file paths to copy directly to clipboard
map kitty_mod+p>f          kitten hints --type path --program @

# Grabs an individual word from screen to paste at active command prompt
map kitty_mod+p>w          kitten hints --type word --program -

# --- Terminal Graphics Protocols ----------------------------------------------
# Dedicated handler tool for viewing in-terminal media images via icat
map kitty_mod+i            kitten icat